<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>links</title>
    <meta name="description" content="All my links in one place." />
    <style>
      :root {
        --bg: #141712;
        --card: #1e231a;
        --border: #2c3325;
        --text: #f2f0e8;
        --muted: #a8a494;
        --accent: #7fbf5a;
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        background-image: radial-gradient(ellipse at top, rgba(127, 191, 90, 0.12), transparent 60%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 64px 20px 32px;
      }
      .card { width: 100%; max-width: 440px; }
      .avatar {
        width: 88px; height: 88px; border-radius: 50%;
        background: var(--accent); color: #10130c;
        display: flex; align-items: center; justify-content: center;
        font-size: 34px; font-weight: 700; margin: 0 auto 16px;
        overflow: hidden;
      }
      .avatar img { width: 100%; height: 100%; object-fit: cover; }
      h1 { font-size: 24px; text-align: center; }
      .bio { color: var(--muted); text-align: center; margin: 8px 0 32px; font-size: 15px; line-height: 1.5; }
      .links { display: flex; flex-direction: column; gap: 12px; }
      .link {
        display: flex; align-items: center; gap: 12px;
        background: var(--card); border: 1px solid var(--border);
        border-radius: 14px; padding: 16px 18px;
        color: var(--text); text-decoration: none;
        font-weight: 600; font-size: 15px;
        transition: border-color 0.15s, transform 0.15s;
      }
      .link:hover { border-color: var(--accent); transform: translateY(-1px); }
      .link .emoji { font-size: 20px; }
      .link small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 2px; }
      footer { margin-top: 48px; color: var(--muted); font-size: 12px; }
      footer a { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="avatar" id="avatar"></div>
      <h1 id="name"></h1>
      <p class="bio" id="bio"></p>
      <div class="links" id="links"></div>
      <footer>made with <a href="https://github.com/Gejogames/link-little">link-little</a></footer>
    </div>
    <script src="links.config.js"></script>
    <script>
      const { profile, links, theme } = window.LINKS

      // theme overrides — edit links.config.js
      if (theme) for (const [k, v] of Object.entries(theme)) {
        document.documentElement.style.setProperty("--" + k, v)
      }

      document.title = `${profile.name} — links`
      document.getElementById("name").textContent = profile.name
      document.getElementById("bio").textContent = profile.bio || ""
      const avatar = document.getElementById("avatar")
      if (profile.avatar) {
        avatar.innerHTML = `<img src="${profile.avatar}" alt="" />`
      } else {
        avatar.textContent = profile.name.slice(0, 2).toUpperCase()
      }

      const list = document.getElementById("links")
      for (const link of links) {
        const a = document.createElement("a")
        a.className = "link"
        a.href = link.url
        a.innerHTML = `
          <span class="emoji">${link.emoji || "🔗"}</span>
          <span>${link.title}${link.hint ? `<small>${link.hint}</small>` : ""}</span>
        `
        list.appendChild(a)
      }
    </script>
  </body>
</html>
